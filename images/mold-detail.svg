<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgMD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="steelM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ab4ce"/>
      <stop offset="50%" stop-color="#5a7592"/>
      <stop offset="100%" stop-color="#3d5468"/>
    </linearGradient>
    <radialGradient id="holeG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001428"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgMD)"/>
  
  <!-- 网格 -->
  <g opacity="0.1">
    <pattern id="gridMD" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="600" fill="url(#gridMD)"/>
  </g>
  
  <!-- 模具分型面展开图 -->
  
  <!-- 主体：动模板 -->
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="600" height="200" fill="url(#steelM)" stroke="#00d4ff" stroke-width="1.2"/>
    
    <!-- 表面光洁纹理（横向） -->
    <g stroke="#00d4ff" stroke-width="0.3" opacity="0.3">
      <line x1="10" y1="20" x2="590" y2="20"/>
      <line x1="10" y1="40" x2="590" y2="40"/>
      <line x1="10" y1="60" x2="590" y2="60"/>
      <line x1="10" y1="80" x2="590" y2="80"/>
      <line x1="10" y1="120" x2="590" y2="120"/>
      <line x1="10" y1="140" x2="590" y2="140"/>
      <line x1="10" y1="160" x2="590" y2="160"/>
      <line x1="10" y1="180" x2="590" y2="180"/>
    </g>
    
    <!-- 4个型腔（圆形产品腔） -->
    <g transform="translate(150, 100)">
      <circle cx="0" cy="0" r="60" fill="url(#holeG)" stroke="#00ff88" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#00ff88" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#00ff88" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="6" fill="#00ff88"/>
    </g>
    <g transform="translate(300, 100)">
      <circle cx="0" cy="0" r="60" fill="url(#holeG)" stroke="#00ff88" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#00ff88" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#00ff88" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="6" fill="#00ff88"/>
    </g>
    <g transform="translate(450, 100)">
      <circle cx="0" cy="0" r="60" fill="url(#holeG)" stroke="#00ff88" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#00ff88" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#00ff88" stroke-width="0.6"/>
      <circle cx="0" cy="0" r="6" fill="#00ff88"/>
    </g>
    
    <!-- 冷却水孔（散布） -->
    <g fill="#001428" stroke="#00d4ff" stroke-width="0.6">
      <circle cx="40" cy="30" r="6"/>
      <circle cx="560" cy="30" r="6"/>
      <circle cx="40" cy="170" r="6"/>
      <circle cx="560" cy="170" r="6"/>
      <circle cx="80" cy="100" r="6"/>
      <circle cx="520" cy="100" r="6"/>
      <circle cx="225" cy="35" r="6"/>
      <circle cx="375" cy="35" r="6"/>
      <circle cx="225" cy="165" r="6"/>
      <circle cx="375" cy="165" r="6"/>
    </g>
    
    <!-- 导柱孔 -->
    <g fill="#001428" stroke="#00d4ff" stroke-width="1">
      <circle cx="30" cy="100" r="12"/>
      <circle cx="570" cy="100" r="12"/>
    </g>
  </g>
  
  <!-- 标注：腔位编号 -->
  <g font-family="monospace" font-size="10" fill="#00d4ff" letter-spacing="2">
    <text x="220" y="260">CAVITY 1</text>
    <text x="370" y="260">CAVITY 2</text>
    <text x="520" y="260">CAVITY 3</text>
  </g>
  
  <!-- 下方：分型面特写（局部剖切） -->
  <g transform="translate(100, 320)">
    <!-- 分型面放大图 -->
    <rect x="0" y="0" width="600" height="180" fill="url(#steelM)" stroke="#00d4ff" stroke-width="1"/>
    
    <!-- 剖切线/分型线 -->
    <line x1="0" y1="90" x2="600" y2="90" stroke="#00ff88" stroke-width="1.2" stroke-dasharray="6,3"/>
    
    <!-- 上下两半标识 -->
    <text x="20" y="40" fill="#00d4ff" font-family="monospace" font-size="11" letter-spacing="2">CORE SIDE · 定模型芯</text>
    <text x="20" y="160" fill="#00d4ff" font-family="monospace" font-size="11" letter-spacing="2">CAVITY SIDE · 动模型腔</text>
    
    <!-- 剖面图例（侧面看型腔轮廓） -->
    <g transform="translate(450, 60)">
      <path d="M 0 0 L 30 -20 L 70 -20 L 100 0 L 100 30 L 70 50 L 30 50 L 0 30 Z" 
            fill="none" stroke="#00ff88" stroke-width="1"/>
      <line x1="0" y1="0" x2="0" y2="30" stroke="#00ff88" stroke-width="0.4" stroke-dasharray="2,2"/>
      <line x1="100" y1="0" x2="100" y2="30" stroke="#00ff88" stroke-width="0.4" stroke-dasharray="2,2"/>
      <text x="50" y="-30" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="9" letter-spacing="1">CROSS-SECTION</text>
    </g>
    
    <!-- 尺寸标注线 -->
    <g stroke="#00d4ff" stroke-width="0.4" fill="none" opacity="0.6">
      <line x1="0" y1="80" x2="0" y2="100"/>
      <line x1="200" y1="80" x2="200" y2="100"/>
      <line x1="0" y1="98" x2="200" y2="98"/>
    </g>
    <text x="100" y="118" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9">200mm</text>
  </g>
  
  <!-- 角标 -->
  <g transform="translate(40, 570)" fill="#00d4ff" opacity="0.6">
    <text font-family="monospace" font-size="9" letter-spacing="2">MOLD CAVITY DETAIL · MULTI-CAVITY TOOLING · BOROD MOULD</text>
  </g>
</svg>