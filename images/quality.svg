<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgQC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="cmiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ab4ce"/>
      <stop offset="100%" stop-color="#3d5468"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgQC)"/>
  
  <!-- 网格 -->
  <g opacity="0.1">
    <pattern id="gridQC" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="600" fill="url(#gridQC)"/>
  </g>
  
  <!-- 三坐标测量仪（CMM） -->
  <g transform="translate(180, 100)">
    
    <!-- 花岗岩底座 -->
    <rect x="0" y="320" width="440" height="120" fill="#3d5468" stroke="#00d4ff" stroke-width="1"/>
    <!-- 花岗岩纹理 -->
    <line x1="20" y1="360" x2="420" y2="360" stroke="#00d4ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="20" y1="400" x2="420" y2="400" stroke="#00d4ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="100" y1="320" x2="100" y2="440" stroke="#00d4ff" stroke-width="0.3" opacity="0.3"/>
    <line x1="220" y1="320" x2="220" y2="440" stroke="#00d4ff" stroke-width="0.3" opacity="0.3"/>
    <line x1="340" y1="320" x2="340" y2="440" stroke="#00d4ff" stroke-width="0.3" opacity="0.3"/>
    
    <!-- X轴横梁 -->
    <rect x="40" y="80" width="380" height="30" fill="url(#cmiGrad)" stroke="#00d4ff" stroke-width="1"/>
    <!-- X轴刻度 -->
    <g stroke="#00d4ff" stroke-width="0.4" opacity="0.6">
      <line x1="60" y1="80" x2="60" y2="90"/>
      <line x1="120" y1="80" x2="120" y2="90"/>
      <line x1="180" y1="80" x2="180" y2="90"/>
      <line x1="240" y1="80" x2="240" y2="90"/>
      <line x1="300" y1="80" x2="300" y2="90"/>
      <line x1="360" y1="80" x2="360" y2="90"/>
    </g>
    
    <!-- Y轴立柱（左右两根） -->
    <rect x="20" y="80" width="20" height="240" fill="url(#cmiGrad)" stroke="#00d4ff" stroke-width="0.8"/>
    <rect x="400" y="80" width="20" height="240" fill="url(#cmiGrad)" stroke="#00d4ff" stroke-width="0.8"/>
    
    <!-- Z轴滑块 + 测头 -->
    <rect x="220" y="110" width="40" height="40" fill="#5a7592" stroke="#00d4ff" stroke-width="0.8"/>
    <!-- 测针 -->
    <line x1="240" y1="150" x2="240" y2="220" stroke="#00ff88" stroke-width="1.5"/>
    <!-- 测头（红宝石） -->
    <circle cx="240" cy="225" r="4" fill="#ff3c3c" stroke="#00ff88" stroke-width="0.8"/>
    
    <!-- 测量工件 -->
    <g transform="translate(180, 240)">
      <rect x="0" y="0" width="120" height="50" fill="#9ab4ce" stroke="#00d4ff" stroke-width="0.8"/>
      <!-- 测量点（红色十字标） -->
      <g stroke="#ff3c3c" stroke-width="0.6">
        <circle cx="20" cy="15" r="3" fill="none"/>
        <circle cx="60" cy="15" r="3" fill="none"/>
        <circle cx="100" cy="15" r="3" fill="none"/>
        <circle cx="20" cy="35" r="3" fill="none"/>
        <circle cx="60" cy="35" r="3" fill="none"/>
        <circle cx="100" cy="35" r="3" fill="none"/>
      </g>
      <!-- 工件标签 -->
      <text x="60" y="-6" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" letter-spacing="2">PART</text>
    </g>
    
    <!-- 数据采集指示线（从测头到工件） -->
    <line x1="240" y1="220" x2="240" y2="240" stroke="#00ff88" stroke-width="0.6" stroke-dasharray="3,2"/>
  </g>
  
  <!-- 测量数据展示屏（右侧） -->
  <g transform="translate(640, 200)">
    <rect x="0" y="0" width="140" height="180" fill="#0a1628" stroke="#00d4ff" stroke-width="1.2"/>
    <!-- 屏幕内容 -->
    <rect x="10" y="10" width="120" height="80" fill="#001428" stroke="#00ff88" stroke-width="0.5"/>
    <!-- 数据行 -->
    <text x="20" y="30" fill="#00ff88" font-family="monospace" font-size="9">X: +24.578</text>
    <text x="20" y="46" fill="#00ff88" font-family="monospace" font-size="9">Y: -12.345</text>
    <text x="20" y="62" fill="#00ff88" font-family="monospace" font-size="9">Z: +08.012</text>
    <text x="20" y="78" fill="#00ff88" font-family="monospace" font-size="9">D: ±0.005mm</text>
    
    <!-- 按钮 -->
    <circle cx="30" cy="120" r="6" fill="#00d4ff" stroke="#00d4ff" stroke-width="0.3"/>
    <circle cx="60" cy="120" r="6" fill="#00ff88" stroke="#00d4ff" stroke-width="0.3"/>
    <circle cx="90" cy="120" r="6" fill="#ff3c3c" stroke="#00d4ff" stroke-width="0.3"/>
    <circle cx="120" cy="120" r="6" fill="#3d5468" stroke="#00d4ff" stroke-width="0.3"/>
    
    <text x="70" y="160" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="8" letter-spacing="1">CMM CONTROL</text>
  </g>
  
  <!-- 角标 -->
  <g transform="translate(40, 570)" fill="#00d4ff" opacity="0.6">
    <text font-family="monospace" font-size="9" letter-spacing="2">CMM PRECISION MEASUREMENT · ±0.005mm · BOROD MOULD</text>
  </g>
</svg>