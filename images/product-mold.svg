<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgMold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8fa4be"/>
      <stop offset="50%" stop-color="#5a7592"/>
      <stop offset="100%" stop-color="#3d5468"/>
    </linearGradient>
    <linearGradient id="metalGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b8298"/>
      <stop offset="50%" stop-color="#3d5468"/>
      <stop offset="100%" stop-color="#1f3346"/>
    </linearGradient>
    <radialGradient id="cavityGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#001428"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </radialGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="560" fill="url(#bgMold)"/>
  <g opacity="0.15">
    <line x1="0" y1="140" x2="800" y2="140" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="800" y2="280" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="800" y2="420" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="560" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="560" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="560" stroke="#00d4ff" stroke-width="0.5"/>
  </g>
  
  <!-- 模具组装爆炸图 - 展示上模/下模/产品 -->
  
  <!-- 上模（动模） -->
  <g transform="translate(120, 80)">
    <rect x="0" y="0" width="560" height="120" fill="url(#metalGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.95"/>
    <rect x="0" y="0" width="560" height="20" fill="#7a8fa6" stroke="#00d4ff" stroke-width="0.5"/>
    <!-- 上模内部型腔 -->
    <rect x="180" y="20" width="200" height="100" fill="url(#cavityGrad)" stroke="#00d4ff" stroke-width="0.8" opacity="0.7"/>
    <!-- 上模导柱孔 -->
    <circle cx="40" cy="60" r="14" fill="#0a1628" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="40" cy="60" r="8" fill="#1a3050" stroke="#00d4ff" stroke-width="0.5"/>
    <circle cx="520" cy="60" r="14" fill="#0a1628" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="520" cy="60" r="8" fill="#1a3050" stroke="#00d4ff" stroke-width="0.5"/>
    <!-- 冷却水孔 -->
    <rect x="60" y="30" width="20" height="20" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.6"/>
    <rect x="480" y="30" width="20" height="20" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.6"/>
    <!-- 标签 -->
    <text x="280" y="-8" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" letter-spacing="2">UPPER MOLD · 动模</text>
  </g>
  
  <!-- 零件（中间产品） -->
  <g transform="translate(280, 230)">
    <!-- 产品剖面 -->
    <path d="M 0 30 L 30 0 L 210 0 L 240 30 L 240 70 L 210 100 L 30 100 L 0 70 Z" 
          fill="url(#metalGrad2)" stroke="#00ff88" stroke-width="1.2"/>
    <!-- 产品内部细节线 -->
    <line x1="30" y1="20" x2="210" y2="20" stroke="#00ff88" stroke-width="0.4" opacity="0.6"/>
    <line x1="30" y1="50" x2="210" y2="50" stroke="#00ff88" stroke-width="0.4" opacity="0.6"/>
    <line x1="30" y1="80" x2="210" y2="80" stroke="#00ff88" stroke-width="0.4" opacity="0.6"/>
    <text x="120" y="-10" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="10" letter-spacing="2">PRODUCT · 注塑件</text>
  </g>
  
  <!-- 下模（定模） -->
  <g transform="translate(120, 360)">
    <rect x="0" y="0" width="560" height="120" fill="url(#metalGrad)" stroke="#00d4ff" stroke-width="1" opacity="0.95"/>
    <rect x="0" y="100" width="560" height="20" fill="#7a8fa6" stroke="#00d4ff" stroke-width="0.5"/>
    <!-- 下模型腔 -->
    <rect x="180" y="0" width="200" height="100" fill="url(#cavityGrad)" stroke="#00d4ff" stroke-width="0.8" opacity="0.7"/>
    <!-- 导柱 -->
    <circle cx="40" cy="60" r="14" fill="#3d5468" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="40" cy="60" r="8" fill="#1f3346" stroke="#00d4ff" stroke-width="0.5"/>
    <circle cx="520" cy="60" r="14" fill="#3d5468" stroke="#00d4ff" stroke-width="1"/>
    <circle cx="520" cy="60" r="8" fill="#1f3346" stroke="#00d4ff" stroke-width="0.5"/>
    <!-- 冷却水孔 -->
    <rect x="60" y="70" width="20" height="20" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.6"/>
    <rect x="480" y="70" width="20" height="20" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.6"/>
    <text x="280" y="140" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="11" letter-spacing="2">LOWER MOLD · 定模</text>
  </g>
  
  <!-- 尺寸标注线 -->
  <g stroke="#00d4ff" stroke-width="0.5" fill="none">
    <line x1="40" y1="60" x2="40" y2="480" stroke-dasharray="2,3" opacity="0.4"/>
    <line x1="520" y1="60" x2="520" y2="480" stroke-dasharray="2,3" opacity="0.4"/>
    <line x1="40" y1="475" x2="520" y2="475" marker-start="url(#arrowL)" marker-end="url(#arrowR)" opacity="0.7"/>
  </g>
  
  <!-- 标记点 -->
  <g fill="#00ff88">
    <circle cx="400" cy="180" r="4"/>
    <circle cx="400" cy="280" r="4"/>
    <circle cx="400" cy="380" r="4"/>
  </g>
  
  <!-- 角标 -->
  <g transform="translate(40, 510)" fill="#00d4ff" opacity="0.6">
    <text font-family="monospace" font-size="9" letter-spacing="2">CAD DRAWING · BOROD MOULD · 2026</text>
  </g>
</svg>