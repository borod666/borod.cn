<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgParts" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="partGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ab4ce"/>
      <stop offset="100%" stop-color="#4a6480"/>
    </linearGradient>
    <linearGradient id="partGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8a890"/>
      <stop offset="100%" stop-color="#6b5e48"/>
    </linearGradient>
    <linearGradient id="partGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a9ba8"/>
      <stop offset="100%" stop-color="#3d5060"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="560" fill="url(#bgParts)"/>
  <g opacity="0.1">
    <pattern id="gridP" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="560" fill="url(#gridP)"/>
  </g>
  
  <!-- 产品阵列 - 展示各种注塑件 -->
  
  <!-- 大型零件 - 汽车内饰件 -->
  <g transform="translate(80, 100)">
    <path d="M 0 60 L 20 0 L 220 0 L 240 60 L 240 180 L 220 220 L 20 220 L 0 180 Z" 
          fill="url(#partGrad1)" stroke="#00d4ff" stroke-width="1"/>
    <!-- 内部纹理 -->
    <line x1="40" y1="40" x2="200" y2="40" stroke="#00d4ff" stroke-width="0.4" opacity="0.5"/>
    <line x1="40" y1="100" x2="200" y2="100" stroke="#00d4ff" stroke-width="0.4" opacity="0.5"/>
    <line x1="40" y1="160" x2="200" y2="160" stroke="#00d4ff" stroke-width="0.4" opacity="0.5"/>
    <!-- 圆角安装孔 -->
    <circle cx="40" cy="110" r="8" fill="#0a1628" stroke="#00d4ff" stroke-width="0.5"/>
    <circle cx="200" cy="110" r="8" fill="#0a1628" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="120" y="250" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" letter-spacing="2">AUTOMOTIVE · 汽车件</text>
  </g>
  
  <!-- 中型零件 - 外壳 -->
  <g transform="translate(360, 80)">
    <rect x="0" y="0" width="160" height="240" rx="14" fill="url(#partGrad2)" stroke="#00d4ff" stroke-width="1"/>
    <!-- 屏幕开窗 -->
    <rect x="20" y="20" width="120" height="80" rx="6" fill="#0a1628" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="30" y1="40" x2="130" y2="40" stroke="#00d4ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="30" y1="60" x2="130" y2="60" stroke="#00d4ff" stroke-width="0.3" opacity="0.4"/>
    <line x1="30" y1="80" x2="130" y2="80" stroke="#00d4ff" stroke-width="0.3" opacity="0.4"/>
    <!-- 按钮 -->
    <circle cx="40" cy="140" r="10" fill="#0a1628" stroke="#00d4ff" stroke-width="0.5"/>
    <circle cx="80" cy="140" r="10" fill="#0a1628" stroke="#00d4ff" stroke-width="0.5"/>
    <circle cx="120" cy="140" r="10" fill="#0a1628" stroke="#00d4ff" stroke-width="0.5"/>
    <!-- 接口 -->
    <rect x="40" y="190" width="30" height="12" fill="#0a1628" stroke="#00d4ff" stroke-width="0.5"/>
    <rect x="90" y="190" width="30" height="12" fill="#0a1628" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="80" y="270" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" letter-spacing="2">ELECTRONIC · 电子件</text>
  </g>
  
  <!-- 小型精密件 - 齿轮 -->
  <g transform="translate(580, 100)">
    <!-- 齿轮外形 -->
    <g transform="translate(80, 80)">
      <g fill="url(#partGrad3)" stroke="#00d4ff" stroke-width="0.8">
        <rect x="-10" y="-80" width="20" height="20"/>
        <rect x="-10" y="60" width="20" height="20"/>
        <rect x="-80" y="-10" width="20" height="20"/>
        <rect x="60" y="-10" width="20" height="20"/>
        <rect x="-65" y="-65" width="18" height="18" transform="rotate(45)"/>
        <rect x="47" y="-65" width="18" height="18" transform="rotate(45)"/>
        <rect x="-65" y="47" width="18" height="18" transform="rotate(45)"/>
        <rect x="47" y="47" width="18" height="18" transform="rotate(45)"/>
      </g>
      <circle cx="0" cy="0" r="70" fill="url(#partGrad3)" stroke="#00d4ff" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="50" fill="none" stroke="#00d4ff" stroke-width="0.5"/>
      <circle cx="0" cy="0" r="25" fill="#0a1628" stroke="#00d4ff" stroke-width="0.8"/>
      <circle cx="0" cy="0" r="8" fill="#1a3050" stroke="#00d4ff" stroke-width="0.4"/>
      <!-- 齿 -->
      <g stroke="#00d4ff" stroke-width="0.4" opacity="0.6">
        <line x1="0" y1="-70" x2="0" y2="-50"/>
        <line x1="49" y1="-49" x2="35" y2="-35"/>
        <line x1="70" y1="0" x2="50" y2="0"/>
        <line x1="49" y1="49" x2="35" y2="35"/>
        <line x1="0" y1="70" x2="0" y2="50"/>
        <line x1="-49" y1="49" x2="-35" y2="35"/>
        <line x1="-70" y1="0" x2="-50" y2="0"/>
        <line x1="-49" y1="-49" x2="-35" y2="-35"/>
      </g>
    </g>
    <text x="80" y="210" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="10" letter-spacing="2">PRECISION · 精密件</text>
  </g>
  
  <!-- 底部排小件 -->
  <g transform="translate(80, 400)">
    <rect x="0" y="0" width="60" height="60" rx="4" fill="url(#partGrad1)" stroke="#00d4ff" stroke-width="0.6"/>
    <circle cx="30" cy="30" r="15" fill="#0a1628" stroke="#00d4ff" stroke-width="0.4"/>
  </g>
  <g transform="translate(180, 410)">
    <rect x="0" y="0" width="80" height="50" rx="6" fill="url(#partGrad2)" stroke="#00d4ff" stroke-width="0.6"/>
    <rect x="10" y="10" width="60" height="30" rx="2" fill="#0a1628" stroke="#00d4ff" stroke-width="0.3"/>
  </g>
  <g transform="translate(310, 415)">
    <circle cx="25" cy="25" r="25" fill="url(#partGrad3)" stroke="#00d4ff" stroke-width="0.6"/>
    <circle cx="25" cy="25" r="12" fill="#0a1628" stroke="#00d4ff" stroke-width="0.4"/>
    <circle cx="25" cy="25" r="4" fill="#1a3050"/>
  </g>
  <g transform="translate(400, 410)">
    <rect x="0" y="0" width="120" height="50" rx="8" fill="url(#partGrad1)" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="20" y1="15" x2="100" y2="15" stroke="#00d4ff" stroke-width="0.3" opacity="0.5"/>
    <line x1="20" y1="35" x2="100" y2="35" stroke="#00d4ff" stroke-width="0.3" opacity="0.5"/>
  </g>
  <g transform="translate(560, 415)">
    <path d="M 0 25 L 25 0 L 75 0 L 100 25 L 75 50 L 25 50 Z" 
          fill="url(#partGrad2)" stroke="#00d4ff" stroke-width="0.6"/>
  </g>
  
  <!-- 角标 -->
  <g transform="translate(40, 510)" fill="#00d4ff" opacity="0.6">
    <text font-family="monospace" font-size="9" letter-spacing="2">PLASTIC INJECTION PARTS · BOROD MOULD · 2026</text>
  </g>
</svg>