<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgFac" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3050"/>
    </linearGradient>
    <linearGradient id="metalG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9ab4ce"/>
      <stop offset="100%" stop-color="#3d5468"/>
    </linearGradient>
    <linearGradient id="metalDG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a7592"/>
      <stop offset="100%" stop-color="#1f3346"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="600" fill="url(#bgFac)"/>
  
  <!-- 网格 -->
  <g opacity="0.1">
    <pattern id="gridFac" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00d4ff" stroke-width="0.5"/>
    </pattern>
    <rect width="800" height="600" fill="url(#gridFac)"/>
  </g>
  
  <!-- 厂房纵剖图 -->
  
  <!-- 顶部：厂房桁架+屋顶 -->
  <g opacity="0.6">
    <line x1="0" y1="80" x2="800" y2="80" stroke="#00d4ff" stroke-width="1"/>
    <line x1="0" y1="100" x2="800" y2="100" stroke="#00d4ff" stroke-width="0.6"/>
    <!-- 三角桁架 -->
    <g stroke="#00d4ff" stroke-width="0.5" opacity="0.5">
      <path d="M 40 100 L 80 60 L 120 100 Z" fill="none"/>
      <path d="M 120 100 L 160 60 L 200 100 Z" fill="none"/>
      <path d="M 200 100 L 240 60 L 280 100 Z" fill="none"/>
      <path d="M 280 100 L 320 60 L 360 100 Z" fill="none"/>
      <path d="M 360 100 L 400 60 L 440 100 Z" fill="none"/>
      <path d="M 440 100 L 480 60 L 520 100 Z" fill="none"/>
      <path d="M 520 100 L 560 60 L 600 100 Z" fill="none"/>
      <path d="M 600 100 L 640 60 L 680 100 Z" fill="none"/>
      <path d="M 680 100 L 720 60 L 760 100 Z" fill="none"/>
    </g>
    <!-- 行车吊轨 -->
    <line x1="0" y1="160" x2="800" y2="160" stroke="#00d4ff" stroke-width="0.6"/>
    <!-- 行车 -->
    <rect x="200" y="155" width="80" height="14" fill="#3d5468" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="240" y1="169" x2="240" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
  </g>
  
  <!-- 左侧：注塑机群（3台） -->
  <g transform="translate(60, 220)">
    <!-- 注塑机1 -->
    <g>
      <rect x="0" y="60" width="100" height="180" fill="url(#metalG)" stroke="#00d4ff" stroke-width="0.8"/>
      <path d="M 30 60 L 40 30 L 60 30 L 70 60 Z" fill="url(#metalDG)" stroke="#00d4ff" stroke-width="0.6"/>
      <rect x="20" y="100" width="60" height="60" fill="#0a1628" stroke="#00ff88" stroke-width="0.4"/>
    </g>
    <!-- 注塑机2 -->
    <g transform="translate(120, 0)">
      <rect x="0" y="60" width="100" height="180" fill="url(#metalG)" stroke="#00d4ff" stroke-width="0.8"/>
      <path d="M 30 60 L 40 30 L 60 30 L 70 60 Z" fill="url(#metalDG)" stroke="#00d4ff" stroke-width="0.6"/>
      <rect x="20" y="100" width="60" height="60" fill="#0a1628" stroke="#00ff88" stroke-width="0.4"/>
    </g>
    <!-- 注塑机3 -->
    <g transform="translate(240, 0)">
      <rect x="0" y="60" width="100" height="180" fill="url(#metalG)" stroke="#00d4ff" stroke-width="0.8"/>
      <path d="M 30 60 L 40 30 L 60 30 L 70 60 Z" fill="url(#metalDG)" stroke="#00d4ff" stroke-width="0.6"/>
      <rect x="20" y="100" width="60" height="60" fill="#0a1628" stroke="#00ff88" stroke-width="0.4"/>
    </g>
  </g>
  
  <!-- 中间：模具存放区 + 货架 -->
  <g transform="translate(450, 200)">
    <!-- 货架 -->
    <rect x="0" y="0" width="120" height="280" fill="none" stroke="#00d4ff" stroke-width="0.8"/>
    <line x1="0" y1="40" x2="120" y2="40" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="120" y2="80" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="120" y2="120" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="120" y2="160" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="120" y2="200" stroke="#00d4ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="120" y2="240" stroke="#00d4ff" stroke-width="0.5"/>
    
    <!-- 模具单元（多层货架上的"货物"） -->
    <g fill="url(#metalDG)" stroke="#00ff88" stroke-width="0.4">
      <rect x="6" y="6" width="50" height="30"/>
      <rect x="60" y="6" width="54" height="30"/>
      <rect x="6" y="46" width="50" height="30"/>
      <rect x="60" y="46" width="54" height="30"/>
      <rect x="6" y="86" width="50" height="30"/>
      <rect x="60" y="86" width="54" height="30"/>
      <rect x="6" y="126" width="50" height="30"/>
      <rect x="60" y="126" width="54" height="30"/>
      <rect x="6" y="166" width="50" height="30"/>
      <rect x="60" y="166" width="54" height="30"/>
      <rect x="6" y="206" width="50" height="30"/>
      <rect x="60" y="206" width="54" height="30"/>
    </g>
    <text x="60" y="270" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="9" letter-spacing="2">MOLD STORAGE</text>
  </g>
  
  <!-- 右侧：CNC加工区 -->
  <g transform="translate(620, 220)">
    <!-- CNC机 -->
    <rect x="0" y="60" width="120" height="160" fill="url(#metalG)" stroke="#00d4ff" stroke-width="1"/>
    <rect x="20" y="80" width="80" height="60" fill="#0a1628" stroke="#00d4ff" stroke-width="0.6"/>
    <rect x="20" y="160" width="80" height="40" fill="#3d5468" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="60" y="184" text-anchor="middle" fill="#00ff88" font-family="monospace" font-size="9">CNC</text>
    
    <!-- 第二个 -->
    <g transform="translate(0, 220)">
      <rect x="0" y="60" width="120" height="40" fill="url(#metalG)" stroke="#00d4ff" stroke-width="1"/>
    </g>
  </g>
  
  <!-- 地面标线 -->
  <g stroke="#00ff88" stroke-width="0.8" fill="none" opacity="0.6">
    <line x1="60" y1="450" x2="740" y2="450"/>
  </g>
  <g stroke="#00d4ff" stroke-width="0.5" fill="none" opacity="0.4" stroke-dasharray="4,4">
    <line x1="200" y1="440" x2="200" y2="450"/>
    <line x1="440" y1="440" x2="440" y2="450"/>
    <line x1="600" y1="440" x2="600" y2="450"/>
  </g>
  
  <!-- 安全标识 -->
  <g transform="translate(380, 510)">
    <rect x="0" y="0" width="40" height="20" fill="#00ff88" stroke="#00d4ff" stroke-width="0.5"/>
    <text x="20" y="14" text-anchor="middle" fill="#001428" font-family="monospace" font-size="9" font-weight="bold">SAFE</text>
  </g>
  
  <!-- 角标 -->
  <g transform="translate(40, 570)" fill="#00d4ff" opacity="0.6">
    <text font-family="monospace" font-size="9" letter-spacing="2">PRODUCTION FLOOR · INJECTION · MOLD STORAGE · CNC · BOROD MOULD</text>
  </g>
</svg>